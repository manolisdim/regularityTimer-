name: TC recorder
# Καταγραφέας για το TC Finder: τρέχει την κανονική σελίδα του Anube σε headless Chrome
# και ανεβάζει τις θέσεις TC / χρόνους στο Firebase. Ξεκινά με το χέρι (Run workflow) ή με το πρόγραμμα.
on:
  workflow_dispatch:
    inputs:
      rally: { description: "Αριθμός αγώνα στο Anube", default: "9274" }
      minutes: { description: "Πόσα λεπτά να τρέξει (μέχρι 345)", default: "330" }
  schedule:
    - cron: "30 7 8 11 *"   # Κυρ 08/11 09:30 ώρα Ελλάδας — 2η μέρα Δαναών
  push:
    branches: [recorder-test]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
        working-directory: recorder
      - run: node rec.js
        working-directory: recorder
        continue-on-error: true
        env:
          RALLY: ${{ github.event.inputs.rally || '9274' }}
          MINUTES: ${{ github.event_name == 'push' && '4' || github.event.inputs.minutes || '330' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anube-${{ github.event.inputs.rally || '9274' }}-${{ github.run_id }}
          path: recorder/data/
          retention-days: 90
      # αντίγραφο και σε ξεχωριστό branch (anube-data), για να το διαβάζει εύκολα η ανάλυση
      - name: Save data to the anube-data branch
        if: always()
        run: |
          set -e
          D=$(date -u +%Y%m%d-%H%M)
          mkdir -p /tmp/out/${{ github.event.inputs.rally || '9274' }}/$D
          cp -r recorder/data/. /tmp/out/${{ github.event.inputs.rally || '9274' }}/$D/ || true
          gzip -f /tmp/out/*/*/raw.jsonl || true
          git config user.name "tc-recorder"; git config user.email "tc-recorder@users.noreply.github.com"
          git fetch origin anube-data || true
          if git rev-parse --verify origin/anube-data >/dev/null 2>&1; then git checkout -B anube-data origin/anube-data; else git checkout --orphan anube-data; git rm -rf . >/dev/null 2>&1 || true; fi
          cp -r /tmp/out/. .
          git add -A . ':!recorder' ':!rally-tc' ':!copilot' 2>/dev/null || git add -A .
          git commit -m "Anube data ${{ github.run_id }}" || true
          git push origin anube-data

