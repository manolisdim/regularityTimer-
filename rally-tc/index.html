Πώς δουλεύει: το Anube στέλνει live (websocket) ένα μήνυμα "setscoring" τη στιγμή που ένα
πλήρωμα περνάει σημείο (το κόκκινο αναβόσβημα). Δεν έχει ώρα ούτε δεύτερα, οπότε
ώρα περάσματος = άφιξη μηνύματος − καθυστέρηση δικτύου του πληρώματος.
Σημείο 0 = εκκίνηση (ακαριαίο λεπτό), σημείο k = TC → χρόνος → μέτρα από τις ΜΩΤ.
Ο κώδικας είναι στο tc.js, που φορτώνεται και μέσα στη σελίδα του Anube με σελιδοδείκτη.
-->
